<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizz de Sobrenatural</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <div id="start-screen" class="screen">
            <h1>QUIZZ DE SOBRENATURAL</h1>
            <p>Você é um verdadeiro caçador? Teste seus conhecimentos sobre as aventuras dos irmãos Winchester!</p>
            <button id="start-btn" class="btn">Iniciar Jogo</button>
        </div>

        <div id="quiz-screen" class="screen hide">
            <div class="quiz-header">
                <span id="question-number">Pergunta 1/20</span>
                <span id="score-counter">Pontos: 0</span>
            </div>
            
            <h2 id="question-text">Texto da Pergunta</h2>
            
            <div id="options-container" class="options-grid">
                </div>

            <div id="feedback" class="feedback hide"></div>

            <button id="next-btn" class="btn hide">Próxima Pergunta</button>
        </div>

        <div id="result-screen" class="screen hide">
            <h2>Fim da Caçada!</h2>
            <p id="final-score">Você acertou X de 20 perguntas.</p>
            <p id="result-message"></p>
            <button id="restart-btn" class="btn">Jogar Novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
